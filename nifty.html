<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neti Bharatam – Nifty</title>
<link rel="stylesheet" href="styles.css">
<script src="page.js" defer></script>
<style>
.nifty-post-list{display:grid;gap:18px;margin-top:22px}
.nifty-post{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:20px;box-shadow:0 4px 14px rgba(0,0,0,.04)}
.nifty-post h3{margin:0 0 10px;color:#17324d}
.nifty-post .post-date{font-size:.88rem;color:#667085;margin-bottom:12px}
.nifty-post .post-body{line-height:1.7;color:#263238}
.nifty-post .post-body p{margin:8px 0}
.nifty-post .post-table-wrap{overflow-x:auto;margin:12px 0 18px}
.nifty-post table{width:100%;border-collapse:collapse;min-width:300px}
.nifty-post th,.nifty-post td{padding:10px 12px;border:1px solid #dfe5e8;text-align:left}
.nifty-post th{background:#edf4f0;color:#17324d}\n.nifty-post td.action-sell{color:#b42318;background:#fff1f0;font-weight:700}\n.nifty-post td.action-buy{color:#15803d;background:#ecfdf3;font-weight:700}
.posts-message{padding:18px;border-radius:10px;background:#f5f7f6;color:#46545b}
</style>
</head>
<body>
<div class="trending-bar"><span class="trending-label" data-en="TRENDING" data-te="ట్రెండింగ్">TRENDING</span><span class="trending-text" data-en="Welcome to Neti Bharatam — news and knowledge in one place" data-te="నేటి భారతం — వార్తలు మరియు విజ్ఞానం ఒకే చోట">Welcome to Neti Bharatam — news and knowledge in one place</span><button class="language-button" id="languageButton" type="button">తెలుగు</button></div>
<header class="site-header"><a class="brand" href="index.html"><img src="assets/netibharatam-logo.png" alt="Neti Bharatam logo with Indian map"></a><div class="header-actions"><nav class="category-nav"><a class="nav-button education-nav" href="education.html"><span>🎓</span><span data-en="Education" data-te="విద్య">Education</span></a><a class="nav-button indian-nav" href="indian-markets.html"><span>📈</span><span data-en="Indian Markets" data-te="భారత మార్కెట్లు">Indian Markets</span></a><a class="nav-button global-nav" href="global-markets.html"><span>🌐</span><span data-en="Global Markets" data-te="ప్రపంచ మార్కెట్లు">Global Markets</span></a></nav></div></header>
<main class="page-content"><section class="news-section"><div class="section-heading"><h2 data-en="Nifty" data-te="నిఫ్టీ">Nifty</h2><span data-en="Indian Markets" data-te="భారత మార్కెట్లు">భారత మార్కెట్లు</span></div>
<div id="niftyPosts" class="nifty-post-list" aria-live="polite"><div class="posts-message">Loading Nifty updates…</div></div>
<p><a class="back-link" href="indian-markets.html" data-en="← Back to Indian Markets" data-te="← భారత మార్కెట్లకు తిరిగి వెళ్ళండి">← Back to Indian Markets</a></p></section></main>
<footer class="site-footer"><span>© <span id="currentYear"></span> Neti Bharatam</span><span data-en="Today's India. Tomorrow's Knowledge." data-te="నేటి భారతం. రేపటి జ్ఞానం.">Today's India. Tomorrow's Knowledge.</span></footer>
<script>
function renderPostBody(container, source){
  const lines=String(source||'').split(/\r?\n/);
  let i=0;
  while(i<lines.length){
    const line=lines[i].trim();
    if(line.startsWith('|') && i+1<lines.length && /^\s*\|?\s*:?-{3,}/.test(lines[i+1])){
      const headers=line.split('|').slice(1,-1).map(x=>x.trim());
      i+=2;
      const table=document.createElement('table');
      const thead=document.createElement('thead');
      const hr=document.createElement('tr');
      headers.forEach(value=>{const th=document.createElement('th');th.textContent=value;hr.appendChild(th);});
      thead.appendChild(hr);table.appendChild(thead);
      const tbody=document.createElement('tbody');
      while(i<lines.length && lines[i].trim().startsWith('|')){
        const cells=lines[i].trim().split('|').slice(1,-1).map(x=>x.trim());
        const tr=document.createElement('tr');
        cells.forEach((value,index)=>{const td=document.createElement('td');td.textContent=value;if(index===0 && value.toUpperCase()==='SELL')td.className='action-sell';if(index===0 && value.toUpperCase()==='BUY')td.className='action-buy';tr.appendChild(td);});
        tbody.appendChild(tr);i++;
      }
      table.appendChild(tbody);
      const wrap=document.createElement('div');wrap.className='post-table-wrap';wrap.appendChild(table);container.appendChild(wrap);
      continue;
    }
    if(line){
      const p=document.createElement('p');p.textContent=line;container.appendChild(p);
    }
    i++;
  }
}
(async function(){
  const root=document.getElementById('niftyPosts');
  try{
    const response=await fetch('https://netibharatam-api.vmadhu430.workers.dev/posts');
    if(!response.ok) throw new Error('Unable to load posts');
    const data=await response.json();
    root.replaceChildren();
    const posts=Array.isArray(data.posts)?data.posts:[];
    if(posts.length===0){
      const empty=document.createElement('div');empty.className='posts-message';empty.textContent='No Nifty updates have been published yet.';root.appendChild(empty);return;
    }
    posts.forEach(post=>{
      const article=document.createElement('article');article.className='nifty-post';
      const heading=document.createElement('h3');heading.textContent=post.title||'Nifty update';
      const date=document.createElement('div');date.className='post-date';
      date.textContent=post.created_at?new Date(post.created_at.replace(' ','T')+'Z').toLocaleString():'';
      const body=document.createElement('div');body.className='post-body';renderPostBody(body,post.body);
      article.append(heading,date,body);root.appendChild(article);
    });
  }catch(error){
    root.replaceChildren();const message=document.createElement('div');message.className='posts-message';
    message.textContent='Nifty updates are temporarily unavailable. Please try again later.';root.appendChild(message);
  }
})();
</script>
</body>
</html>
